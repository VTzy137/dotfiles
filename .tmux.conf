# tmux (linked to ~/.tmux.conf by the tmux module). Prefix: Ctrl+B
# Reload after editing: Ctrl+B then r

# ---- basics ----------------------------------------------------------------
# Always zsh in new panes/windows (even if this login session still says SHELL=bash)
if-shell "[ -x /usr/bin/zsh ]" "set -g default-shell /usr/bin/zsh"
set -g mouse on                      # click panes, drag borders, scroll
set -g history-limit 50000
set -g base-index 1                  # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10               # Esc is instant (zsh vi mode, vim)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true colour (TokyoNight in nvim)
setw -g mode-keys vi                 # copy mode: v to select, y to copy
set -s set-clipboard on
setw -g mode-style "bg=#49ff6d,fg=#0c1c25"   # selection colour: green (palette Color2)

# ---- splits (open in the current folder) -----------------------------------
#   Ctrl+B %  or |   side by side       Ctrl+B "  or -   top and bottom
bind %  split-window -h -c "#{pane_current_path}"
bind |  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"
#   No prefix:  Alt+Shift+L right   Alt+Shift+H left
#               Alt+Shift+K top     Alt+Shift+J bottom
bind -n M-L split-window -h  -c "#{pane_current_path}"
bind -n M-H split-window -hb -c "#{pane_current_path}"
bind -n M-K split-window -vb -c "#{pane_current_path}"
bind -n M-J split-window -v  -c "#{pane_current_path}"

# ---- move / resize, vim style ----------------------------------------------
#   Ctrl+B h/j/k/l move    Ctrl+B H/J/K/L resize (hold to repeat)
#   Alt+h/j/k/l move without the prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Mouse drag-select copies straight to the system clipboard (Wayland, else X11)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- status bar: hidden, just the terminal. Ctrl+B b shows/hides it --------
set -g status off
bind b set -g status
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
